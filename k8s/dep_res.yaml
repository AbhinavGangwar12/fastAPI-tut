apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-dummy 
  template:
    metadata:
      labels:
        app: backend-dummy 
    spec:
      containers:
      - name: backend-container 
        image: nginx:1.24
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "10000m"
      
