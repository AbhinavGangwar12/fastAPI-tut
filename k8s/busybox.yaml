apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy-box
spec:
  replicas: 2
  selector:
    matchLabels:
      app: busy-box 
  template:
    metadata:
      labels:
        app: busy-box 
    spec:
      containers:
      - name: busy-box-container
        image: busybox:latest
        command: ["/bin/sh", "-c", "echo 'Model load failed'; exit 1"]
